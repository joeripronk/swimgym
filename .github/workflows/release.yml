name: Release APK

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: "17"
          distribution: "temurin"

#      - name: Set up Node 24
#        uses: actions/setup-node@v5
#        with:
#          node-version: 24

      - name: Setup keystore
        env:
          STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          printf "storeFile=app/release-keystore.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n" "$STORE_PASSWORD" "$KEY_ALIAS" "$STORE_PASSWORD" > keystore.properties
          printf "storeFile=app/release-keystore.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n" "[redacted]" "$KEY_ALIAS" "[redacted]"

      - name: Build release APK
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease

      - name: Get version
        id: version
        run: |
          tag="${{ github.ref_name }}"
          version_name=$(echo "$tag" | sed 's/^v\([0-9]*\.[0-9]*\)p.*/\1/')
          version_code=$(echo "$tag" | sed 's/^v[0-9]*\.[0-9]*p\([0-9]*\)/\1/')
          echo "version_name=$version_name" >> "$GITHUB_OUTPUT"
          echo "version_code=$version_code" >> "$GITHUB_OUTPUT"
          apkfile="app/build/outputs/swimgym-${tag}.apk"
          mv "app/build/outputs/apk/release/app-release.apk" "$apkfile"

      - name: Upload release APK
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.version.outputs.apkfile }}
          name: v${{ steps.version.outputs.tag }}
          generate_release_notes: true
