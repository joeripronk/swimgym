name: Release APK

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Decode keystore
        run: |
          printf '%s' "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > app/release-keystore.jks

      - name: Build release APK
        run: |
          echo "storeFile=app/release-keystore.jks" > keystore.properties
          echo "storePassword=${{ secrets.KEYSTORE_PASSWORD }}" >> keystore.properties
          echo "keyAlias=${{ secrets.KEY_ALIAS }}" >> keystore.properties
          echo "keyPassword=${{ secrets.KEY_PASSWORD }}" >> keystore.properties
          chmod +x ./gradlew
          ./gradlew assembleRelease

      - name: Get version
        id: version
        run: |
          tag="${{ github.ref_name }}"
          version_name=$(echo "$tag" | sed 's/^v\([0-9]*\.[0-9]*\)p.*/\1/')
          version_code=$(echo "$tag" | sed 's/^v[0-9]*\.[0-9]*p\([0-9]*\)/\1/')
          echo "version_name=$version_name" >> "$GITHUB_OUTPUT"
          echo "version_code=$version_code" >> "$GITHUB_OUTPUT"

      - name: Upload release APK
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/release/app-release.apk
          name: v${{ steps.version.outputs.version_name }} (code ${{ steps.version.outputs.version_code }})
          generate_release_notes: true
