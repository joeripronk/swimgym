name: Release APK

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: "17"
          distribution: "temurin"

#      - name: Set up Node 24
#        uses: actions/setup-node@v5
#        with:
#          node-version: 24

      - name: Setup keystore
        env:
          STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          printf "storeFile=app/release-keystore.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n" "$STORE_PASSWORD" "swimgym" "$STORE_PASSWORD" > keystore.properties

      - name: Build release APK
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease

      - name: Get version
        id: version
        run: |
          apkdir="app/build/outputs/apk/release"
          apk="${apkdir}/app-release.apk"
          apkfile="${apkdir}/swimgym-${{ github.ref_name }}.apk"
          mv "$apk" "$apkfile"
          echo "apkfile=$apkfile" >> "$GITHUB_OUTPUT"

      - name: Upload release APK
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.version.outputs.apkfile }}
          name: ${{ github.ref_name }}
          generate_release_notes: true
